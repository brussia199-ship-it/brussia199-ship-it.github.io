<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INTERNET TV — Прямой эфир</title>

    <!-- =========================================================== -->
    <!-- 1. ЗАЩИТА ОТ ИНСТРУМЕНТОВ РАЗРАБОТЧИКА                      -->
    <!-- =========================================================== -->
    <script>
        (function() {
            'use strict';

            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (e.ctrlKey && (e.key === 'U' || e.key === 'S' || e.key === 'P')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (e.key === 'F1') {
                    e.preventDefault();
                    return false;
                }
            }, true);

            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            }, true);

            window.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey) {
                    e.preventDefault();
                    return false;
                }
                if (e.metaKey && e.altKey && e.key === 'I') {
                    e.preventDefault();
                    return false;
                }
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
            }, true);

            window.addEventListener('keyup', function(e) {
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
            }, true);

            console.log('🛡️ Защита активирована!');
        })();
    </script>

    <style>
        /* =========================================================== */
        /* 2. СТИЛИ                                                   */
        /* =========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-main);
            background-image:
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cinema-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* ===== АДАПТИВ ДЛЯ МОБИЛЬНЫХ ===== */
        @media (max-width: 800px) {
            .cinema-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            body {
                padding: 8px;
            }
            .side-dashboard {
                padding: 16px;
            }
            .station-info h1 {
                font-size: 22px;
            }
            .meta-list li {
                padding: 6px 0;
                font-size: 12px;
            }
            .clock {
                font-size: 18px;
            }
            .btn-modern {
                padding: 12px;
                font-size: 11px;
            }
        }

        @media (max-width: 450px) {
            .side-dashboard {
                padding: 12px;
                border-radius: 16px;
            }
            .station-info h1 {
                font-size: 18px;
                margin: 6px 0 0 0;
            }
            .badge-live {
                font-size: 9px;
                padding: 3px 10px;
            }
            .meta-list li {
                padding: 5px 0;
                font-size: 11px;
            }
            .meta-list {
                margin: 10px 0;
            }
            .clock {
                font-size: 15px;
                margin: 4px 0 6px 0;
            }
            .btn-modern {
                padding: 10px;
                font-size: 10px;
                border-radius: 10px;
                letter-spacing: 1px;
            }
            .action-container {
                gap: 6px;
            }
        }

        /* ПЛЕЕР */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-theater {
            position: relative;
            background: #000;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-glow);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            width: 100%;
        }

        .main-theater iframe,
        .main-theater #vk-iframe-placeholder {
            width: 100%;
            height: 100%;
            border: none;
        }

        .shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            cursor: default;
            pointer-events: auto;
            background: transparent;
        }

        /* САЙДБАР */
        .side-dashboard {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .station-info h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 8px 0 0 0;
            background: linear-gradient(135deg, #fff 35%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 165, 0, 0.12);
            color: #FF8C00;
            padding: 3px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 165, 0, 0.2);
        }

        .pulse-ring {
            width: 5px;
            height: 5px;
            background: #FF8C00;
            border-radius: 50%;
            animation: live-glow 1.5s infinite;
        }

        @keyframes live-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(255, 165, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0);
            }
        }

        .clock {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            text-align: center;
            margin: 4px 0 8px 0;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .clock:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .meta-list {
            margin: 12px 0 16px 0;
            padding: 0;
            list-style: none;
            font-size: 13px;
            color: #94a3b8;
        }

        .meta-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
        }

        .meta-list li:last-child {
            border-bottom: none;
        }

        .meta-list strong {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* КНОПКИ */
        .action-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-modern {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            padding: 13px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-modern:active {
            transform: scale(0.97);
        }

        .btn-modern:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .btn-glow {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
            color: #fff;
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .btn-glow:active {
            background: linear-gradient(135deg, #0369a1 0%, #4338ca 100%);
        }

        /* Двойные кнопки в ряд */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-row .btn-modern {
            padding: 13px 8px;
            font-size: 11px;
            letter-spacing: 0.8px;
        }

        @media (max-width: 450px) {
            .btn-row {
                gap: 6px;
            }
            .btn-row .btn-modern {
                padding: 10px 6px;
                font-size: 9px;
                letter-spacing: 0.5px;
                border-radius: 10px;
            }
        }

        /* =========================================================== */
        /* 3. АДМИН-ПАНЕЛЬ                                            */
        /* =========================================================== */
        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-overlay.active {
            display: flex;
        }

        .admin-panel {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .admin-panel h2 {
            color: var(--accent);
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .admin-panel .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .admin-panel label {
            display: block;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .admin-panel input,

            padding: 12px 14px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;

        .admin-panel input:focus,

        }

        .admin-panel textarea {
            min-height: 100px;
            resize: vertical;
        }

        .admin-panel .btn-submit {
            width: 100%;

            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;

        .admin-panel .btn-submit:hover {

        }

        .admin-panel .btn-close {

            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: #94a3b8;

            cursor: pointer;
            transition: color 0.2s;
        }

        .admin-panel .btn-close:hover {
            color: #fff;

        .admin-panel .status-msg {

            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .admin-panel .status-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .admin-panel .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .admin-panel .video-list {
            margin-top: 16px;
            max-height: 150px;
            overflow-y: auto;
        }

        .admin-panel .video-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 13px;
            color: #e2e8f0;
        }

        .admin-panel .video-list-item .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .admin-panel .video-list-item .remove-btn:hover {
            color: #dc2626;
        }

        .admin-panel .hint {
            color: #64748b;
            font-size: 12px;
            margin-top: -12px;
            margin-bottom: 12px;
        }

        /* Стили для ввода пароля */
        .password-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .password-section .password-input-row {
            display: flex;
            gap: 10px;
        }

        .password-section .password-input-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .password-section .password-input-row .btn-check {
            padding: 12px 20px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .password-section .password-input-row .btn-check:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .password-section .password-status {
            margin-top: 8px;
            font-size: 13px;
            display: none;
        }

        .password-section .password-status.error {
            display: block;
            color: #f87171;
        }

        .password-section .password-status.success {
            display: block;
            color: #4ade80;
        }

        .admin-content {
            display: none;
        }

        .admin-content.active {
            display: block;
        }

        .password-lock-icon {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="admin-overlay" id="adminOverlay">

    <!-- =========================================================== -->
    <!-- 6. ОСНОВНОЙ СКРИПТ                                          -->
    <!-- =========================================================== -->
    <script>
        // ============================================================
        // ПАРОЛЬ
        // ============================================================
        const ADMIN_PASSWORD = 'Pawlin228!';

        // ============================================================
        // ПЛЕЙЛИСТ
        // ============================================================
        let playlist = [
            { oid: '-232854892', id: '456239108', title: 'ВИКТОРОВИЧ' },
            { oid: '-217256769', id: '456239103', title: 'Чип и дейл спешат на помощь' },
            { oid: '-217256769', id: '456239102', title: 'А4 — Челлендж на кухне' }
        ];

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let currentTrackIndex = 0;
        let isMuted = true;
        let player = null;
        let savedTime = 0;
        let trackTimer = null;
        let clickCount = 0;
        let clickTimer = null;
        let isPasswordCorrect = false;

        // ============================================================
        // ⏰ ЧАСЫ + ОТКРЫТИЕ АДМИНКИ ПО 20 КЛИКАМ
        // ============================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = h + ':' + m + ':' + s;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Обработчик кликов по часам
        document.getElementById('clockDisplay').addEventListener('click', function() {
            clickCount++;

            if (clickTimer) clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 2000);

            if (clickCount >= 20) {
                clickCount = 0;
                // Сбрасываем пароль при открытии
                isPasswordCorrect = false;
                document.getElementById('passwordSection').style.display = 'block';
                document.getElementById('adminContent').classList.remove('active');
                document.getElementById('adminPassword').value = '';
                document.getElementById('passwordStatus').className = 'password-status';
                document.getElementById('passwordStatus').textContent = '';
                document.getElementById('adminOverlay').classList.add('active');
            }
        });

        // ============================================================
        // ПРОВЕРКА ПАРОЛЯ
        // ============================================================
        document.getElementById('checkPasswordBtn').addEventListener('click', function() {
            checkPassword();
        });

        document.getElementById('adminPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function checkPassword() {
            const input = document.getElementById('adminPassword');
            const status = document.getElementById('passwordStatus');
            const password = input.value.trim();

            if (password === ADMIN_PASSWORD) {
                isPasswordCorrect = true;
                status.className = 'password-status success';
                status.textContent = '✅ Доступ разрешён!';
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('adminContent').classList.add('active');
                updateVideoList();
                setTimeout(() => {
                    status.className = 'password-status';
                    status.textContent = '';
                }, 1500);
            } else {
                status.className = 'password-status error';
                status.textContent = '❌ Неверный пароль! Попробуйте снова.';
                input.value = '';
                input.focus();
                setTimeout(() => {
                    status.className = 'password-status';
                    status.textContent = '';
                }, 3000);
            }
        }

        // ============================================================
        // АДМИН-ПАНЕЛЬ — ДОБАВЛЕНИЕ ВИДЕО
        // ============================================================
        function parseVkUrl(url) {
            const match = url.match(/video(-?\d+)_(\d+)/);
            if (match) {
                return { oid: match[1], id: match[2] };
            }
            return null;
        }

        document.getElementById('addVideoBtn').addEventListener('click', function() {
            if (!isPasswordCorrect) {
                document.getElementById('statusMsg').className = 'status-msg error';
                document.getElementById('statusMsg').textContent = '❌ Сначала введите пароль!';
                return;
            }

            const urlInput = document.getElementById('videoUrl');
            const titleInput = document.getElementById('videoTitle');
            const statusMsg = document.getElementById('statusMsg');

            const url = urlInput.value.trim();
            const title = titleInput.value.trim() || 'Без названия';

            if (!url) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '❌ Введите ссылку на видео';
                return;
            }

            const parsed = parseVkUrl(url);
            if (!parsed) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '❌ Неверный формат ссылки. Пример: https://vk.com/video-123456_789012';
                return;
            }

            playlist.push({
                oid: parsed.oid,
                id: parsed.id,
                title: title
            });

            updateVideoList();
            updateCurrentVideo();

            statusMsg.className = 'status-msg success';
            statusMsg.textContent = '✅ Видео добавлено!';
            urlInput.value = '';
            titleInput.value = '';

            createPlayer();
            startTrackTimer();
        });

        function updateVideoList() {
            const list = document.getElementById('videoList');
            if (playlist.length === 0) {
                list.innerHTML =
                '<div style="color:#64748b;font-size:13px;text-align:center;padding:12px;">Плейлист пуст</div>';
                return;
            }

            list.innerHTML = playlist.map((item, index) =>
                `<div class="video-list-item">
                    <span>${index + 1}. ${item.title}</span>
                    <button class="remove-btn" data-index="${index}">✕</button>
                </div>`
            ).join('');

            list.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    if (confirm(`Удалить "${playlist[index].title}"?`)) {
                        playlist.splice(index, 1);
                        updateVideoList();
                        if (currentTrackIndex >= playlist.length) {
                            currentTrackIndex = 0;
                        }
                        createPlayer();
                        startTrackTimer();
                    }
                });
            });
        }

        function updateCurrentVideo() {
            if (playlist.length > 0 && currentTrackIndex >= playlist.length) {
                currentTrackIndex = 0;
            }
            if (playlist.length > 0) {
                document.getElementById('currentShowTitle').textContent = playlist[currentTrackIndex].title;
            } else {
                document.getElementById('currentShowTitle').textContent = 'Плейлист пуст';
            }
        }

        // Закрытие админки
        document.getElementById('adminClose').addEventListener('click', function() {
            document.getElementById('adminOverlay').classList.remove('active');
        });

        document.getElementById('adminOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // ============================================================
        // СОХРАНЕНИЕ СОСТОЯНИЯ
        // ============================================================
        function loadSavedState() {
            const saved = localStorage.getItem('internet_tv_state');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.trackIndex !== undefined) {
                        currentTrackIndex = data.trackIndex % playlist.length;
                    }
                    if (data.time) {
                        savedTime = parseFloat(data.time) || 0;
                    }
                    if (data.playlist) {
                        playlist = data.playlist;
                    }
                } catch (e) { /* тихо */ }
            }
        }

        function saveCurrentState(time) {
            try {
                localStorage.setItem('internet_tv_state', JSON.stringify({
                    trackIndex: currentTrackIndex,
                    time: time || 0,
                    playlist: playlist
                }));
            } catch (e) { /* тихо */ }
        }

        // ============================================================
        // СОЗДАНИЕ ПЛЕЕРА (VK)
        // ============================================================
        function createPlayer() {
            const container = document.getElementById('playerContainer');
            const placeholder = document.getElementById('vk-iframe-placeholder');
            if (!placeholder) return;

            if (playlist.length === 0) {
                placeholder.innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:16px;">Плейлист пуст</div>';
                document.getElementById('currentShowTitle').textContent = 'Плейлист пуст';
                return;
            }

            if (currentTrackIndex >= playlist.length) {
                currentTrackIndex = 0;
            }

            const video = playlist[currentTrackIndex];
            document.getElementById('currentShowTitle').textContent = video.title;

            placeholder.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.src =
                `https://vk.com/video_ext.php?oid=${video.oid}&id=${video.id}&hash=5d6e5c6d7b1e84&autoplay=1&mute=${isMuted ? 1 : 0}`;
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture;';
            iframe.allowFullscreen = true;
            iframe.frameBorder = '0';
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';

            placeholder.appendChild(iframe);
            player = iframe;

            let shield = document.getElementById('shield');
            if (!shield) {
                shield = document.createElement('div');
                shield.className = 'shield';
                shield.id = 'shield';
                container.appendChild(shield);
            }

            console.log('🎬 VK Video:', video.title);
        }

        // ============================================================
        // АВТОПЕРЕКЛЮЧЕНИЕ
        // ============================================================
        function startTrackTimer() {
            if (trackTimer) clearTimeout(trackTimer);
            if (playlist.length === 0) return;
            trackTimer = setTimeout(() => {
                currentTrackIndex++;
                if (currentTrackIndex >= playlist.length) {
                    currentTrackIndex = 0;
                }
                savedTime = 0;
                saveCurrentState(0);
                createPlayer();
                startTrackTimer();
            }, 480000);
        }

        // ============================================================
        // КНОПКА ЗВУКА
        // ============================================================
        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', function() {
            isMuted = !isMuted;
            this.textContent = isMuted ? '🔊 Звук' : '🔇 Без звука';
            createPlayer();
            startTrackTimer();
        });

        // ============================================================
        // КНОПКА ПОЛНЫЙ ЭКРАН
        // ============================================================
        document.getElementById('fs-btn').addEventListener('click', function() {
            const container = document.getElementById('playerContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
        });

        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadSavedState();
        createPlayer();
        startTrackTimer();

        window.addEventListener('beforeunload', function() {
            saveCurrentState(0);
        });

        console.log('📺 INTERNET TV загружен!');
        console.log('🔑 Админ-панель: 20 кликов по часам');
        console.log('🔒 Пароль: ' + ADMIN_PASSWORD);
    </script>

</body>
</html>
